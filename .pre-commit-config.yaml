# Mandatory local checks (issue #60). Install once with:
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# The default_install_hook_types below makes a bare `pre-commit install`
# wire up both the pre-commit and commit-msg stages.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # C/C++ formatting. Pinned to clang-format 19.1.3 so the hook, CI and the
  # committed tree agree byte-for-byte. Only vendor CMSIS device headers are
  # skipped, both by .clang-format-ignore and by the explicit exclude below;
  # the migrated newlib / system_* / vectors_* C++ sources are formatted.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.3
    hooks:
      - id: clang-format
        # Match our extensions explicitly (identify does not reliably tag the
        # C++20 module extension .cppm), so restrict by filename instead of type.
        types_or: [text]
        files: \.(c|h|cpp|hpp|cppm)$
        exclude: |
          (?x)^(
            sdk/core/include/(cmsis|cortexm|arm|diag)/|
            sdk/hal/[^/]+/include/cmsis/|
            sdk/sensors/displays/ssd1306/font5x7\.cppm$
          )

  # Conventional Commits lint on the commit message (English history).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
