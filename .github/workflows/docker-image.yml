name: Docker image

# Build and publish the SDK build image to GHCR whenever the image definition
# changes. `stmtool build` / `stmtool test` pull this image for real use; CI
# builds its own cached copy for hermetic runs (see build.yml).
on:
  push:
    branches: [develop]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          push: true
          tags: ghcr.io/khosta77/stm32-sdk-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
