name: Format

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      # Runs the clang-format hook pinned to 19.1.3 in .pre-commit-config.yaml,
      # so CI, the local hook and the committed tree use the same formatter.
      - name: clang-format check
        run: pre-commit run clang-format --all-files --show-diff-on-failure
